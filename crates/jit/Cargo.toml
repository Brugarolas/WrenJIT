[package]
name = "b3"
version = "0.1.9"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/playxe/b3-rs"
readme = "README.md"
description = "A Rust port of B3 WebKit codegen backend"
keywords = ["jit", "compiler", "codegen", "llvm"]
authors = ["Adel Prokurov <adel.prokurov@gmail.com>"]
categories = ["compilers"]

[dependencies]
tinyvec = { version = "1.13.3", features = ["alloc"] }
num-traits = "0.2.19"
num-integer = "0.1.47"
macroassembler =  { path = "../macroassembler" }
once_cell = "1.21.4"
paste = "1.0.15"
indexmap = "2.14.2"
libc = "0.2.191"
cfg-if = "1.0.5"
cool-bitvector = "0.1.1"

[features]
disassembly = ["macroassembler/x86-disasm", "macroassembler/arm-disasm"]

[dev-dependencies]
criterion = "0.8.2"
target-lexicon = "0.13.5"
cranelift = "0.136.3"
cranelift-module = "0.136.3"
cranelift-jit = "0.136.3"
pico-args = "0.5"
mimalloc = "0.1.52"
r7rs-parser = { git = "https://github.com/playxe/r7rs-parser" }

[[bench]]
name = "brainfuck"
harness = false

[[bench]]
name = "factorial"
harness = false

